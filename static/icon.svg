<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8573f"/>
      <stop offset="0.55" stop-color="#c0392b"/>
      <stop offset="1" stop-color="#7a1f1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.6">
      <stop offset="0" stop-color="#ffd59a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffd59a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe9d6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- sound waves -->
  <g fill="none" stroke="#ffd59a" stroke-linecap="round">
    <path d="M150 170 Q120 225 150 280" stroke-width="20" opacity="0.9"/>
    <path d="M362 170 Q392 225 362 280" stroke-width="20" opacity="0.9"/>
    <path d="M108 135 Q62 225 108 315" stroke-width="18" opacity="0.55"/>
    <path d="M404 135 Q450 225 404 315" stroke-width="18" opacity="0.55"/>
  </g>
  <!-- microphone -->
  <rect x="206" y="104" width="100" height="178" rx="50" fill="url(#mic)"/>
  <g stroke="#c0392b" stroke-width="7" stroke-linecap="round" opacity="0.35">
    <line x1="230" y1="150" x2="282" y2="150"/>
    <line x1="230" y1="178" x2="282" y2="178"/>
    <line x1="230" y1="206" x2="282" y2="206"/>
  </g>
  <path d="M180 236 Q180 326 256 326 Q332 326 332 236" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
  <line x1="256" y1="326" x2="256" y2="378" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
  <line x1="206" y1="386" x2="306" y2="386" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
